name: Deploy to Azure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Existing azd environment to deploy
        required: true
        default: dev
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy application
    runs-on: ubuntu-latest
    environment: azure-deployment
    env:
      AZURE_ENV_NAME: ${{ inputs.environment }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: Azure/setup-azd@v2
      - name: Initialize azd environment
        shell: bash
        run: |
          azd env new "$AZURE_ENV_NAME" \
            --subscription "$AZURE_SUBSCRIPTION_ID" \
            --location "$AZURE_LOCATION"
          azd env set AZURE_TENANT_ID "$AZURE_TENANT_ID"
          azd env set IMAGE_TAG "$GITHUB_SHA"
          azd env refresh
      - name: Deploy
        run: azd deploy --environment "$AZURE_ENV_NAME"
