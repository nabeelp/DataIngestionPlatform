[project]
name = "dq-engine"
version = "0.1.0"
description = "Python and Polars data quality engine"
requires-python = ">=3.12,<3.13"
dependencies = [
  "azure-identity>=1.19,<2",
  "azure-monitor-opentelemetry>=1.6,<2",
  "azure-servicebus>=7.14,<8",
  "azure-storage-blob>=12.24,<13",
  "fastapi>=0.115,<1",
  "fastexcel>=0.21.0",
  "jsonschema>=4.25,<5",
  "mssql-python>=1.0,<2",
  "polars>=1.44.2",
  "pyarrow>=25.0.1",
  "pydantic>=2.11,<3",
  "referencing>=0.36,<1",
  "sqlglot>=26,<31",
  "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
dq-engine = "dq_engine.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.18,<2",
  "pytest>=8.4,<9",
  "ruff>=0.14,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[[tool.uv.index]]
url = "https://packagefeedproxy.microsoft.io/pypi/simple/"
default = true

[tool.hatch.build.targets.wheel]
packages = ["src/dq_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["dq_engine"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*"]
ignore_missing_imports = true
